# Agency White-Label Branding Configuration
# This file dictates all visual styling and branding for generated HTML and PDF reports.
# No hardcoded branding exists in report templates.

agency:
  name: "Apex Search Intelligence"
  tagline: "Next-Generation Technical SEO & AI Search Visibility Audits"
  website: "https://apexsearch.example.com"
  email: "audits@apexsearch.example.com"
  phone: "+1 (555) 019-2834"
  logo_url: "" # Path or base64 data URI; if empty, renders agency name in brand typography

colors:
  primary: "#1E293B"      # Deep slate for headers and prominent cards
  secondary: "#0284C7"    # Professional cyan/blue for accents and links
  accent: "#10B981"       # Emerald for high-performing metrics and passes
  warning: "#F59E0B"      # Amber for medium warnings
  danger: "#EF4444"       # Red for critical issues and failures
  background: "#F8FAFC"   # Light clean gray canvas
  text: "#0F172A"         # High-contrast slate text

typography:
  font_family: "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  code_family: "'JetBrains Mono', 'Fira Code', Menlo, monospace"

report_settings:
  show_executive_summary: true
  show_top_actions_matrix: true
  show_detailed_findings: true
  show_methodology_limitations: true
  show_appendix_evidence: true
  disclaimer: "This audit is generated using rigorous statistical sampling and deterministic crawl heuristics. Search and AI engine results change dynamically over time."

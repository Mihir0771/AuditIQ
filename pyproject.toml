[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditiq"
version = "0.1.0"
description = "Production-grade AI SEO and GEO (Generative Engine Optimization) Audit Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AuditIQ Core Team", email = "dev@auditiq.local" }
]
keywords = [
    "seo",
    "geo",
    "aeo",
    "audit",
    "search-engine-optimization",
    "generative-ai",
    "ai-visibility",
    "crawler"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "httpx>=0.27.0",
    "httpcore>=1.0.0",
    "selectolax>=0.3.21",
    "lxml>=5.2.0",
    "playwright>=1.44.0",
    "extruct>=0.17.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "typer[all]>=0.12.3",
    "rich>=13.7.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.1",
    "tenacity>=8.3.0",
    "tldextract>=5.1.2",
    "simhash>=2.1.2",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "hypothesis>=6.103.0",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "pre-commit>=3.7.1",
]

[project.scripts]
auditiq = "auditiq.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/auditiq"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["auditiq"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "selectolax.*",
    "extruct.*",
    "simhash.*",
    "tldextract.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/auditiq"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
